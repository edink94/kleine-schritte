function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function defaults(){return {name:'',avatar:'☁️',voice:true,history:[],missions:{},legacyStars:0};}

 }

 if(old&&typeof old==='object')return {...defaults(),name:typeof old.childName==='string'?old.childName.slice(0,22):'',avatar:typeof old.avatar==='string'?old.avatar:'☁️',legacyStars:Number.isFinite(old.stars)?limit(old.stars,0,99999):0};

function dailyMissions(){
 const key=today();const saved=data.missions[key];
 if(Array.isArray(saved)&&saved.length===3&&saved.every(id=>TASK_BY_ID[id]))return saved;
 const a=TASKS.filter(t=>t.world==='wort'&&t.level<=Math.min(2,1+Math.floor(visits('wort')/9)));
 const b=TASKS.filter(t=>t.world==='zahl'&&t.level<=Math.min(2,1+Math.floor(visits('zahl')/9)));
 const otherWorld=['knobel','stift','wissen','mut','bewegung'][hash(key+'world')%5];
 const c=TASKS.filter(t=>t.world===otherWorld&&t.level<=Math.min(2,1+Math.floor(visits(otherWorld)/7)));
 const pick=(tasks,salt)=>{
  const unseen=tasks.filter(t=>!data.history.some(e=>e.id===t.id));
  const pool=unseen.length?unseen:tasks;
  return pool[hash(key+salt)%pool.length].id;
 };

 persist();return ids;
}

function speak(text,{force=false}={}){

 try{

function playPage(){const t=currentTask;if(!t)return worldsPage();const w=worldById(t.world),s=gameState;
 return `<section class="game-shell"><div class="game-nav"><button class="back" data-action="back-game">← Zurück</button><span class="game-place">${w.icon} ${w.name} · ${t.level===1?'Leicht':'Knifflig'}</span></div><div class="game-card"><div class="game-header"><div class="ribbon">Momo stellt dir eine Aufgabe</div><h1>${esc(t.prompt)}</h1><button class="soundbig" data-action="read-task" aria-label="Aufgabe und Antworten anhören">🔊 Aufgabe anhören</button><div class="game-buddy" aria-hidden="true">${mascot(s.done?'happy':s.message?'cheer':'')}</div></div>${visual(t)}<div class="game-body">${t.story?`<div class="story-card"><button class="story-btn" data-action="toggle-story" aria-expanded="${s.storyOpen}">📖 Geschichte ${s.storyOpen?'verstecken':'anzeigen'} ▾</button>${s.storyOpen?`<p class="story-text">${esc(t.story)}</p>`:''}</div>`:''}${t.type==='choice'?answerOptions(t):t.type==='memory'?memoryView(t):t.type==='sequence'?sequenceView(t):t.type==='select'?selectView(t):t.type==='trace'?traceView(t):offlineView(t)}<div class="game-feedback" id="game-feedback" aria-live="polite">${feedbackHtml()}</div>${!s.done&&t.hint?`<p class="game-hint">💜 Tipp: ${esc(t.hint)}</p>`:''}</div></div></section>`;

function rewardsPage(){const cats=new Set(data.history.map(x=>x.world)),days=playedDays(),all=[
  {icon:'🌱',name:'Erster Schritt',desc:'Ein Spiel ausprobiert',on:data.history.length>0},
  {icon:'⭐',name:'Sternenglanz',desc:'10 Sterne gesammelt',on:stars()>=10},

 ];
 return `<section><div class="page-head"><div class="eyebrow">✨ Deine Sammlung</div><h1>Jeder kleine Schritt zählt</h1><p>Hier geht es ums Ausprobieren, nicht um Noten oder ums Gewinnen gegen andere.</p></div><div class="prize-hero"><span class="big-prize">🏆</span><div><h2>${stars()} Stern${stars()===1?'':'e'} gesammelt</h2><p>${days} Tag${days===1?'':'e'} voller neugieriger Entdeckungen. Weiter so!</p></div></div>${sectionHead('Deine Abzeichen','Jedes Abzeichen erinnert dich an etwas Schönes.')}<div class="achievements">${all.map(b=>`<div class="badge-card ${b.on?'':'locked'}"><span class="badge-icon">${b.icon}</span><strong>${b.name}</strong><p>${b.on?'Freigeschaltet!':'Noch zu entdecken'} · ${b.desc}</p></div>`).join('')}</div></section>`;
}
function parentsPage(){const most=Math.max(1,...WORLDS.map(w=>visits(w.id)));return `<section><div class="page-head"><div class="eyebrow">👨‍👩‍👧 Bereich für Erwachsene</div><h1>Gemeinsam wachsen 💜</h1><p>Hier siehst du, welche Lernwelten dein Kind ausprobiert hat. Die Häufigkeit ist <strong>keine</strong> Aussage über Schulreife oder Begabung.</p></div><div class="stats"><div class="stat"><strong>${stars()}</strong><small>Gesammelte Sterne</small></div><div class="stat"><strong>${data.history.length}</strong><small>Abgeschlossene Übungen</small></div><div class="stat"><strong>${playedDays()}</strong><small>Spieltage</small></div></div>${sectionHead('Entdeckte Lernwelten','Keine Bewertungen, keine Vergleiche.')}<div class="parent-grid"><div class="panel"><h2>Spielübersicht</h2><p>Die Balken zeigen ausschließlich, wie häufig eine Welt besucht wurde.</p><div class="activity-meter">${WORLDS.map(w=>`<div class="meter-row"><span>${w.icon} ${w.name}<small>${visits(w.id)} Spiele</small></span><div class="meter-track"><div style="width:${visits(w.id)/most*100}%;background:${w.accent}"></div></div></div>`).join('')}</div></div><div class="panel"><h2>Kind & Einstellungen</h2><label class="field-label" for="kid-name">Vorname oder Spitzname (optional)</label><input class="field" id="kid-name" maxlength="22" type="text" autocomplete="off" placeholder="Wie soll Momo dich nennen?" value="${esc(data.name)}"/><label class="field-label">Lieblingssymbol</label><div class="avatar-row">${['☁️','🦊','🐰','🐼','🦄','🐬'].map(a=>`<button class="avatar-choice ${data.avatar===a?'selected':''}" data-avatar="${a}" aria-label="Symbol ${a}" aria-pressed="${data.avatar===a}">${a}</button>`).join('')}</div><button class="btn small" data-action="save-profile">💜 Profil speichern</button><div class="privacy"><strong>🔒 Kindgerecht und privat</strong><br>Alle Einträge bleiben ausschließlich in diesem Browser auf diesem Gerät. Keine Anmeldung, Werbung, Analyse, Cloud oder Datenweitergabe. Das Browser-Sprachsystem kann von Gerät und Betriebssystem abhängen; dafür wird von dieser App selbst kein Audio an einen eigenen Server geschickt.</div><button class="danger" data-action="reset">🗑️ Lernfortschritt zurücksetzen …</button></div></div><div class="parent-tip"><h3>🌻 Das Üben im Alltag ist genauso wichtig</h3><p>Gemeinsam vorlesen, draußen balancieren, Mengen beim Tischdecken zählen, neue Wörter entdecken und über Gefühle sprechen sind wertvolle Ergänzungen. Kinder entwickeln sich unterschiedlich. Bei Fragen zur Entwicklung helfen Kita, Schule oder pädagogische Fachkräfte weiter.</p></div></section>`;}
function render(){const pages={home,worlds:worldsPage,world:worldPage,play:playPage,rewards:rewardsPage,parents:parentsPage};$('#app').innerHTML=shell((pages[screen]||home)());
 if(screen==='play'&&currentTask?.type==='trace'&&!gameState.done)requestAnimationFrame(initDrawing);
}
function notify(msg){const root=$('#toast');if(!root)return;root.innerHTML=`<div class="toast-msg">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{root.innerHTML='';},2800);}
function clearTransient(){if(memoTimer){clearTimeout(memoTimer);memoTimer=null;}try{window.speechSynthesis?.cancel();}catch{}document.documentElement.classList.remove('momo-talking');gameState=null;currentTask=null;}
function changePage(page){clearTransient();screen=page;chosenTopic='Alle';render();window.scrollTo({top:0,behavior:'instant'});}
function goWorld(id){if(!worldById(id))return;clearTransient();screen='world';chosenWorld=id;chosenTopic='Alle';render();window.scrollTo({top:0,behavior:'instant'});}
function shuffle(arr,salt){const a=[...arr];let seed=hash(salt)||1;for(let i=a.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeDeck(pairCount,id){const pool=['🐳','🍉','🌈','🚀','🦊','🌻','🐠','🦋'];const pairs=pool.slice(0,pairCount).flatMap((e,i)=>[{emoji:e,key:i},{emoji:e,key:i}]);return shuffle(pairs,today()+id+String(data.history.length));}
function startTask(id){const t=TASK_BY_ID[id];if(!t)return;const came=screen==='play'?origin:screen;clearTransient();origin=came;screen='play';chosenWorld=t.world;currentTask=t;
 gameState={done:false,earned:false,tries:0,wrong:[],message:'',storyOpen:false,selected:[],used:[],placed:[],drawPoints:[],drawLength:0,
  revealed:[],matched:[],busy:false,moves:0,...(t.type==='memory'?{deck:makeDeck(t.pairs,t.id)}:{})};
 render();window.scrollTo({top:0,behavior:'instant'});
 if(data.voice)announceTask(t);
}
function backGame(){const world=currentTask?.world;if(origin==='home')changePage('home');else if(origin==='world')goWorld(world);else changePage('worlds');}
function nextGame(){const t=currentTask;const same=worldTasks(t.world).filter(x=>x.id!==t.id);const unseen=same.filter(x=>!done(x.id));const pool=unseen.length?unseen:same;const index=hash(t.id+today()+String(data.history.length))%pool.length;startTask(pool[index].id);}
// A tiny, local success melody (no sound files or network), controlled by 🔊/🔇.
function playJingle(){
 if(!data.voice)return;
 try{
  const Context=window.AudioContext||window.webkitAudioContext;
  if(!Context)return;
  const audio=new Context();
  [523.25,659.25,783.99].forEach((hz,i)=>{
   const oscillator=audio.createOscillator(),gain=audio.createGain();
   oscillator.type='sine';oscillator.frequency.value=hz;
   oscillator.connect(gain);gain.connect(audio.destination);
   const start=audio.currentTime+i*.115;
   gain.gain.setValueAtTime(.0001,start);
   gain.gain.exponentialRampToValueAtTime(.028,start+.025);
   gain.gain.exponentialRampToValueAtTime(.0001,start+.27);
   oscillator.start(start);oscillator.stop(start+.28);
  });
  setTimeout(()=>audio.close().catch(()=>{}),1100);
 }catch{/* Optional sound enhancement; learning remains usable without Web Audio. */}
}
function award(){if(!currentTask||gameState.done)return;
 gameState.done=true;
 if(done(currentTask.id)){gameState.earned=false;}
 else{gameState.earned=true;data.history.push({date:today(),id:currentTask.id,world:currentTask.world,tries:Math.max(1,gameState.tries),ts:new Date().toISOString()});if(data.history.length>3000)data.history=data.history.slice(-3000);persist();}
 render();celebrate();playJingle();if(data.voice)speak('Juhu! Toll gemacht, weiter so!');
}
function celebrate(){if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;const stage=$('#confetti');stage.textContent='';const colors=['#f7ac91','#d1abfd','#9dd8ff','#ffd575','#9ee3ac'];for(let i=0;i<25;i++){const p=document.createElement('span');p.className='confetti-piece';p.style.left=(5+(i*41%91))+'%';p.style.background=colors[i%colors.length];p.style.animationDelay=((i*13%43)/100)+'s';p.style.setProperty('--drift',((i*79%180)-90)+'px');p.style.setProperty('--rot',(i*37)+'deg');stage.append(p);}setTimeout(()=>stage.textContent='',2500);}
function answer(i){const t=currentTask,s=gameState;if(!t||t.type!=='choice'||!s||s.done||s.wrong.includes(i))return;
 s.tries++;
 if(i===t.answer){award();return;}
 s.wrong.push(i);s.message=t.hint?`Fast! ${t.hint}`:'Probier es noch einmal. Momo hilft dir! 💜';
 render();if(data.voice)speak('Fast! Probier es noch einmal.');
}
function flip(i){const s=gameState;if(!s||!currentTask||s.done||s.busy||s.matched.includes(i)||s.revealed.includes(i))return;
 s.revealed.push(i);if(s.revealed.length===2){s.moves++;s.tries++;const [a,b]=s.revealed;
  if(s.deck[a].key===s.deck[b].key){s.matched.push(a,b);s.revealed=[];if(s.matched.length===s.deck.length){award();return;}}
  else {s.busy=true;const stable=s;memoTimer=setTimeout(()=>{if(gameState!==stable)return;stable.revealed=[];stable.busy=false;memoTimer=null;render();},950);}
 }
 render();
}
function sequencePick(i){const s=gameState,t=currentTask;if(!s||t?.type!=='sequence'||s.done||s.used.includes(i))return;
 s.tries++;const val=t.items[i];if(val===t.order[s.placed.length]){s.placed.push(val);s.used.push(i);s.message='';if(s.placed.length===t.order.length){award();return;}render();}
 else{s.message='Schau noch einmal: Welche Zahl kommt jetzt?';render();if(data.voice)speak('Welche Zahl kommt jetzt?');}
}
function toggleSelection(i){const s=gameState,t=currentTask;if(!s||t?.type!=='select'||s.done)return;
 s.selected=s.selected.includes(i)?s.selected.filter(v=>v!==i):[...s.selected,i];s.wrong=[];s.message='';render();
}
function checkSelection(){const s=gameState,t=currentTask;if(!s||t?.type!=='select'||s.done)return;const correct=t.items.map((x,i)=>t.selected.includes(x.label)?i:-1).filter(x=>x!==-1),chosen=s.selected;
 s.tries++;if(chosen.length===correct.length&&chosen.every(i=>correct.includes(i))){award();return;}
 s.wrong=chosen.filter(i=>!correct.includes(i));s.message='Schau noch mal genau hin. Vielleicht fehlt ein Bild oder eines passt nicht.';render();if(data.voice)speak('Schau noch einmal genau hin.');
}
function initDrawing(){if(currentTask?.type!=='trace'||gameState?.done)return;
 const canvas=$('#trace-canvas');if(!canvas)return;const css=canvas.getBoundingClientRect();if(!css.width||!css.height)return;
 const scale=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(css.width*scale);canvas.height=Math.round(css.height*scale);
 const ctx=canvas.getContext('2d');if(!ctx)return;ctx.setTransform(scale,0,0,scale,0,0);
 const w=css.width,h=css.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#fcfaff';ctx.fillRect(0,0,w,h);
 ctx.save();ctx.strokeStyle='#cbbbea';ctx.lineWidth=11;ctx.lineJoin='round';ctx.lineCap='round';ctx.setLineDash([2,18]);
 const p=(x,y)=>[w*x/600,h*y/320];const move=(x,y)=>ctx.moveTo(...p(x,y));const line=(x,y)=>ctx.lineTo(...p(x,y));
 const bez=(a,b,c,d,e,f)=>{const b1=p(a,b),b2=p(c,d),end=p(e,f);ctx.bezierCurveTo(...b1,...b2,...end);};
 const sh=currentTask.trace;
 if(/^[A-Z0-9]$/.test(sh)){ctx.font=`900 ${Math.min(w*.55,h*.83)}px Trebuchet MS, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=9;ctx.strokeText(sh,w/2,h*.55);}
 else{
  ctx.beginPath();switch(sh){
   case 'welle':move(45,155);bez(95,35,155,35,205,155);bez(255,275,315,275,365,155);bez(410,35,495,35,555,155);break;
   case 'zickzack':move(45,245);line(140,60);line(235,245);line(335,60);line(435,245);line(555,60);break;
   case 'kreis':ctx.ellipse(w*.5,h*.5,w*.3,h*.38,0,0,Math.PI*2);break;
   case 'spirale':{const cx=w/2,cy=h/2;for(let k=0;k<=95;k++){const a=k*.115,r=k*Math.min(w,h)*.0031;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;k===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}break;}
   case 'schleife':move(70,200);bez(150,15,275,45,300,160);bez(340,310,490,290,535,145);bez(555,50,435,15,300,160);bez(165,280,85,250,70,200);break;
   case 'linie':move(45,170);line(550,170);break;
   case 'quadrat':move(185,55);line(425,55);line(425,265);line(185,265);ctx.closePath();break;
   case 'dreieck':move(300,40);line(505,265);line(95,265);ctx.closePath();break;
   default:move(55,160);line(545,160);
  }ctx.stroke();
 }
 ctx.restore();
 const redrawStrokes=()=>{ctx.save();ctx.strokeStyle='#8b67d6';ctx.lineWidth=7;ctx.lineJoin='round';ctx.lineCap='round';ctx.setLineDash([]);for(const points of gameState.drawPoints){if(!points.length)continue;ctx.beginPath();ctx.moveTo(points[0][0]*w,points[0][1]*h);points.forEach(pt=>ctx.lineTo(pt[0]*w,pt[1]*h));ctx.stroke();}ctx.restore();};
 redrawStrokes();
 let drawing=false;const coords=e=>{const box=canvas.getBoundingClientRect();return [limit((e.clientX-box.left)/box.width,0,1),limit((e.clientY-box.top)/box.height,0,1)];};
 canvas.onpointerdown=e=>{if(gameState.done)return;e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);gameState.drawPoints.push([coords(e)]);};
 canvas.onpointermove=e=>{if(!drawing||gameState.done)return;e.preventDefault();const list=gameState.drawPoints.at(-1),point=coords(e),last=list.at(-1);if(!last)return;
  const length=Math.hypot((point[0]-last[0])*w,(point[1]-last[1])*h);if(length<1)return;
  gameState.drawLength+=length;list.push(point);redrawStrokes();const button=$('#finish-trace');if(button)button.disabled=gameState.drawLength<30;
 };
 canvas.onpointerup=e=>{drawing=false;try{canvas.releasePointerCapture(e.pointerId)}catch{}};
 canvas.onpointercancel=()=>{drawing=false;};
}
function resetTrace(){if(!gameState||gameState.done)return;gameState.drawPoints=[];gameState.drawLength=0;initDrawing();}
function currentAudioOption(index){const t=currentTask;if(!t||t.type!=='choice')return;const v=t.options[index];if(v)speak(`Antwort ${index+1}. ${verbal(v.say)}.`,{force:true});}
function closeModal(){const m=$('#confirm-modal');if(m)m.remove();activeModal=false;if(pendingFocus&&typeof pendingFocus.focus==='function')pendingFocus.focus();pendingFocus=null;}
function confirmReset(){if(activeModal)return;activeModal=true;pendingFocus=document.activeElement;const div=document.createElement('div');div.id='confirm-modal';div.className='modal-shade';div.innerHTML=`<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-desc"><h2 id="dialog-title">Fortschritt zurücksetzen?</h2><p id="dialog-desc">Alle Sterne, erledigten Übungen und Tagesmissionen auf diesem Gerät werden gelöscht. Spitzname, Figur und Vorlesen bleiben erhalten.</p><div class="buttons"><button class="btn outline small" data-action="close-modal">Abbrechen</button><button class="danger" data-action="reset-confirm">Ja, löschen</button></div></div>`;document.body.append(div);div.querySelector('button').focus();}
function handleAction(action){switch(action){
 case 'next-mission':{const next=dailyMissions().find(id=>!done(id));if(next)startTask(next);else changePage('worlds');break;}
 case 'speak-home':speak(`Hallo ${data.name||'du'}! Ich bin Momo. Schön, dass du da bist. Komm, wir starten ein buntes Lernabenteuer.`,{force:true});break;
 case 'toggle-voice':data.voice=!data.voice;persist();if(!data.voice){try{window.speechSynthesis?.cancel()}catch{}document.documentElement.classList.remove('momo-talking');}render();notify(data.voice?'Ton und automatisches Vorlesen eingeschaltet':'Ton und automatisches Vorlesen ausgeschaltet');break;
 case 'read-task':announceTask();break;
 case 'toggle-story':if(gameState){gameState.storyOpen=!gameState.storyOpen;render();}break;
 case 'back-game':backGame();break;
 case 'next-game':nextGame();break;
 case 'clear-trace':resetTrace();break;
 case 'finish-trace':if(gameState?.drawLength>=30){gameState.tries=1;award();}break;
 case 'finish-offline':if(gameState&&!gameState.done){gameState.tries=1;award();}break;
 case 'check-selection':checkSelection();break;
 case 'save-profile':{const e=$('#kid-name');data.name=(e?.value||'').trim().slice(0,22);persist();render();notify('Gespeichert! 💜');break;}
 case 'reset':confirmReset();break;
 case 'close-modal':closeModal();break;
 case 'reset-confirm':{const copy={name:data.name,avatar:data.avatar,voice:data.voice};data={...defaults(),...copy};persist();closeModal();render();notify('Lernfortschritt zurückgesetzt.');break;}
 }}
document.addEventListener('click',e=>{
 const btn=e.target.closest('button');if(!btn)return;
 if(btn.dataset.page){changePage(btn.dataset.page);return;}
 if(btn.dataset.world){goWorld(btn.dataset.world);return;}
 if(btn.dataset.task){startTask(btn.dataset.task);return;}
 if(btn.dataset.topic){chosenTopic=btn.dataset.topic;render();return;}
 if(btn.dataset.answer!==undefined){answer(Number(btn.dataset.answer));return;}
 if(btn.dataset.audioOption!==undefined){currentAudioOption(Number(btn.dataset.audioOption));return;}
 if(btn.dataset.memory!==undefined){flip(Number(btn.dataset.memory));return;}
 if(btn.dataset.seq!==undefined){sequencePick(Number(btn.dataset.seq));return;}
 if(btn.dataset.select!==undefined){toggleSelection(Number(btn.dataset.select));return;}
 if(btn.dataset.avatar){data.avatar=btn.dataset.avatar;document.querySelectorAll('[data-avatar]').forEach(el=>{const selected=el.dataset.avatar===data.avatar;el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',String(selected));});return;}
 if(btn.dataset.action)handleAction(btn.dataset.action);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeModal)closeModal();});
if('serviceWorker'in navigator&&['https:','http:'].includes(location.protocol)){

}
